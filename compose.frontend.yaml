services:
  frontend:
    build:
      context: ./Frontend
    ports:
      - "3001:3000"
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      BROWSER: none
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3000}
    volumes:
      - ./Frontend:/app
      - /app/node_modules
